<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Skillfully: canvas</title>
    <style>
    :root {
      --chassis: #000;
      --panel: #121214;
      --well: #19191c;
      --rail: #26262b;
      --text: #f4f4f5;
      --dim: #a1a1aa;
      --accent: #f7941d;
      --ok: #4ade80;
      --bad: #f87171;
      --font: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --row: 60px;
      --gap: 8px;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      background: var(--chassis);
      color: var(--text);
      font-family: var(--font);
    }
    body {
      min-height: 100dvh;
      padding: 14px max(12px, env(safe-area-inset-right)) 72px max(12px, env(safe-area-inset-left));
    }
    main {
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }
    main > * {
      min-width: 0;
    }
    [hidden] {
      display: none !important;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
    }
    h1 {
      font-size: 19px;
      font-weight: 600;
      margin: 0;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .shelfHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .shelfHead h2 {
      margin: 0;
    }
    /* The canvas shown, which opens the list of the others and a way to start a new one. */
    #switcher {
      flex: 1;
      min-width: 0;
      position: relative;
    }
    #switchName {
      list-style: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      font-size: 19px;
      font-weight: 600;
      padding: 6px 10px;
      margin-left: -10px;
      border-radius: 10px;
    }
    #switchName::-webkit-details-marker {
      display: none;
    }
    #switchName span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #switchName svg {
      flex: none;
    }
    #switchName:hover {
      background: var(--panel);
    }
    #switchName svg {
      transition: transform .15s ease;
    }
    #switcher[open] #switchName svg {
      transform: rotate(180deg);
    }
    #switchList {
      position: absolute;
      top: calc(100% + 4px);
      left: -10px;
      z-index: 8;
      min-width: 240px;
      max-width: min(360px, calc(100vw - 24px));
      max-height: 60vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--rail);
      border-radius: 12px;
      padding: 6px;
      display: grid;
      box-shadow: 0 12px 32px #000a;
    }
    #switchList button {
      background: none;
      text-align: left;
      font-weight: 500;
      padding: 10px 12px;
      min-height: 0;
      border-radius: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #switchList button:hover {
      background: var(--rail);
    }
    #switchList button[aria-current] {
      color: var(--accent);
    }
    #switchList .new {
      border-top: 1px solid var(--rail);
      border-radius: 0 0 8px 8px;
      margin-top: 4px;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--dim);
      flex: none;
    }
    .led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--bad);
    }
    .led.on {
      background: var(--ok);
    }
    select,
    button {
      font: inherit;
      color: var(--text);
      background: var(--rail);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 12px;
      min-height: 40px;
    }
    button {
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled {
      cursor: default;
    }
    select:focus-visible,
    button:focus-visible,
    .slider:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .quiet {
      background: none;
      border-color: var(--rail);
      font-weight: 500;
      flex: none;
    }
    .quiet[aria-expanded="true"] {
      background: var(--rail);
    }

    /*
     * In full screen a canvas is a control surface: the controls and nothing else. Its name and buttons go,
     * the page tabs stay when there is more than one page, and the connection shows only when it is lost,
     * in the corner.
     */
    body.kiosk {
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    body.kiosk main {
      gap: 8px;
    }
    body.kiosk header {
      min-height: 0;
    }
    body.kiosk header > :not(.link) {
      display: none !important;
    }
    body.kiosk header .link {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      z-index: 6;
      background: var(--panel);
      border-radius: 999px;
      padding: 6px 12px;
    }
    body.kiosk header .link:has(.led.on) {
      display: none;
    }

    /* On a phone the canvas's name has a line of its own, and what can be done with it goes below. */
    @media (max-width: 640px) {
      header {
        flex-wrap: wrap;
        row-gap: 8px;
      }
      h1,
      #switcher {
        order: 1;
        flex: 1 1 calc(100% - 60px);
      }
      header .link {
        order: 2;
      }
      #layouts,
      #arrange {
        order: 3;
      }
      #layouts {
        margin-right: auto;
      }
    }

    /* Which of its two layouts a canvas is shown in */
    #layouts {
      display: flex;
      flex: none;
      background: var(--panel);
      border-radius: 999px;
      padding: 3px;
    }
    #layouts button {
      background: none;
      color: var(--dim);
      border-radius: 999px;
      padding: 5px 12px;
      min-height: 32px;
      font-size: 13px;
    }
    #layouts button[aria-pressed="true"] {
      background: var(--rail);
      color: var(--text);
    }
    @media (max-width: 520px) {
      #layouts button {
        padding: 5px 9px;
      }
    }

    /* The pages of one canvas */
    #pages {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #pages button {
      flex: none;
      background: none;
      color: var(--dim);
      border-radius: 999px;
      padding: 6px 14px;
      min-height: 36px;
    }
    #pages button[aria-selected="true"] {
      background: var(--rail);
      color: var(--text);
    }
    #proposedNote {
      margin: 0 0 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px dashed var(--accent);
      font-size: 14px;
      line-height: 1.45;
      max-width: 528px;
    }
    #proposedNote[hidden] {
      display: none;
    }
    #board[inert] {
      opacity: .8;
    }
    #notes {
      margin: 0;
      font-size: 13px;
      color: var(--dim);
      display: grid;
      gap: 2px;
    }
    #notes:empty {
      display: none;
    }
    #notes .bad {
      color: var(--bad);
    }

    /* The grid every piece sits on */
    #scroll {
      overflow-x: auto;
      margin: 0 -4px;
      padding: 4px;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(var(--cols, 4), minmax(38px, 1fr));
      grid-auto-rows: var(--row);
      gap: var(--gap);
      margin: 0 auto;
    }
    /* A desktop layout: a whole screen of fine cells, every row there, the whole of it drawn to fit. */
    #board.fixed {
      --row: 28px;
      --gap: 4px;
      grid-template-columns: repeat(var(--cols), var(--row));
      grid-template-rows: repeat(var(--rows), var(--row));
    }
    #board.fixed .piece {
      border-radius: 10px;
    }
    .piece {
      min-width: 0;
      min-height: 0;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
    }
    .back {
      background: var(--panel);
      border-radius: 16px;
      margin: -4px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--dim);
      line-height: calc(var(--row) + 8px);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .label {
      display: flex;
      align-items: center;
      padding: 0 4px;
      font-weight: 600;
      font-size: 16px;
      line-height: 1.2;
      border-radius: 0;
    }
    .label.small {
      font-size: 13px;
      font-weight: 500;
      color: var(--dim);
    }
    .label.large {
      font-size: 24px;
    }
    .name {
      font-size: 12px;
      line-height: 1.2;
      color: var(--dim);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
    }
    .num {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      white-space: nowrap;
    }
    .readout,
    .clock {
      background: var(--well);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 14px;
    }
    .readout.tall,
    .clock {
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }
    .readout .num {
      font-size: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .readout.tall .num {
      font-size: 26px;
    }
    .clock {
      container-type: size;
    }
    .clock .num {
      line-height: 1;
      font-size: 28px;
    }
    @supports (font-size: 1cqh) {
      .clock .num {
        font-size: min(62cqh, calc(150cqw / var(--letters, 8)));
      }
      .clock .name + .num {
        font-size: min(46cqh, calc(150cqw / var(--letters, 8)));
      }
    }

    /* Buttons and switches */
    button.piece {
      --on: var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px;
      min-height: 0;
      background: var(--rail);
      border: 2px solid transparent;
      font-size: 14px;
      line-height: 1.15;
      text-align: center;
      overflow-wrap: anywhere;
      touch-action: manipulation;
      transition: transform 80ms, background 120ms;
    }
    button.piece.tinted {
      border-color: color-mix(in srgb, var(--on) 55%, transparent);
    }
    button.piece.lit {
      background: var(--on);
      border-color: var(--on);
      color: #000;
    }
    button.piece:active:not(.off) {
      transform: scale(.97);
    }
    button.piece.went {
      border-color: var(--text);
    }
    button.piece.failed {
      border-color: var(--bad);
    }
    /* A button doing its steps, until the last is done. */
    button.piece.busy {
      border-color: var(--on, var(--accent));
      cursor: progress;
      animation: busy 1.2s ease-in-out infinite;
    }
    @keyframes busy {
      50% {
        opacity: .6;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      button.piece.busy {
        animation: none;
      }
    }
    button.piece .state {
      font-size: 12px;
      font-weight: 500;
      opacity: .75;
    }
    .piece.red {
      --on: #f87171;
    }
    .piece.green {
      --on: #4ade80;
    }
    .piece.blue {
      --on: #60a5fa;
    }
    .piece.yellow {
      --on: #fde047;
    }
    .piece.white {
      --on: #f4f4f5;
    }

    /* Sliders: taller than wide, they stand up */
    .slider {
      background: var(--well);
      display: grid;
      padding: 8px 6px;
      gap: 6px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }
    .slider.up {
      grid-template-rows: auto 1fr auto;
      justify-items: center;
      text-align: center;
      padding: 8px 2px;
    }
    .slider.up .name {
      font-size: 11px;
      overflow-wrap: break-word;
    }
    .slider.across {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto 1fr;
      align-items: center;
      padding: 6px 12px;
      column-gap: 10px;
    }
    .slider .num {
      font-size: 13px;
    }
    .track {
      position: relative;
      background: var(--rail);
      border-radius: 999px;
    }
    /* The track stops short of each end by half a thumb, so the thumb never leaves the piece. */
    .up .track {
      width: 8px;
      height: calc(100% - 14px);
      min-height: 20px;
      align-self: center;
    }
    .across .track {
      grid-column: 1 / -1;
      height: 8px;
      width: calc(100% - 14px);
      justify-self: center;
    }
    .fill {
      position: absolute;
      background: var(--accent);
      border-radius: 999px;
    }
    .up .fill {
      left: 0;
      right: 0;
      bottom: 0;
    }
    .across .fill {
      top: 0;
      bottom: 0;
      left: 0;
    }
    .thumb {
      position: absolute;
      background: var(--text);
      border-radius: 6px;
      box-shadow: 0 1px 4px #000a;
    }
    .up .thumb {
      width: 30px;
      height: 14px;
      left: 50%;
      transform: translate(-50%, 50%);
    }
    .across .thumb {
      width: 14px;
      height: 26px;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* A meter: a number shown as a bar */
    .meter,
    .light,
    .choice,
    .updown {
      --on: var(--accent);
      background: var(--well);
    }
    .meter {
      display: grid;
      gap: 6px;
    }
    .meter.up {
      grid-template-rows: auto 1fr auto;
      justify-items: center;
      text-align: center;
      padding: 8px 2px;
    }
    .meter.across {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto 1fr;
      align-items: center;
      padding: 6px 12px;
      column-gap: 10px;
    }
    .meter .track {
      overflow: hidden;
    }
    .meter .fill {
      background: var(--on);
      transition: width 120ms, height 120ms;
    }
    .meter .num {
      font-size: 13px;
    }

    /* A light */
    .light {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      transition: background 150ms;
    }
    .light.tall {
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }
    .light .dot {
      flex: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #222226;
      box-shadow: inset 0 0 0 2px #3f3f46;
      transition: background 150ms, box-shadow 150ms;
    }
    .light.tall .dot {
      width: 22px;
      height: 22px;
    }
    .light .name {
      font-size: 14px;
      color: var(--text);
    }
    .light.lit {
      background: color-mix(in srgb, var(--on) 22%, var(--well));
    }
    .light.lit .dot {
      background: var(--on);
      box-shadow: 0 0 12px var(--on);
    }

    /* One of a few */
    .choice {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 4px;
      padding: 4px 6px 6px;
    }
    .choice .name {
      padding: 0 6px;
    }
    .choice .options {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 4px;
      min-height: 0;
    }
    .choice.up .options {
      grid-auto-flow: row;
      grid-auto-rows: minmax(0, 1fr);
    }
    .choice button {
      min-height: 0;
      overflow: hidden;
      padding: 2px 4px;
      font-size: 13px;
      line-height: 1.1;
      touch-action: manipulation;
      border: 0;
    }
    .choice button span {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: break-word;
    }
    .choice.many button {
      font-size: 12px;
    }
    .choice button.lit {
      background: var(--on);
      color: #000;
    }
    /* The flash after a press is drawn inside, so it takes none of the room two lines of words need. */
    .choice button.went {
      box-shadow: inset 0 0 0 2px var(--text);
    }
    .choice button.failed {
      box-shadow: inset 0 0 0 2px var(--bad);
    }

    /* A number with a button each side. Its own name: .stepper is Arrange's Wide and Tall. */
    .updown {
      container-type: size;
      padding: 6px;
    }
    .updown .in {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(40px, 64px) minmax(0, 1fr) minmax(40px, 64px);
      grid-template-areas: "less mid more";
      gap: 6px;
    }
    .updown .less {
      grid-area: less;
    }
    .updown .more {
      grid-area: more;
    }
    .updown .mid {
      grid-area: mid;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-width: 0;
    }
    .updown button {
      min-height: 0;
      padding: 0;
      font-size: 22px;
      font-weight: 500;
      line-height: 1;
      touch-action: manipulation;
      border: 2px solid transparent;
    }
    .updown button:active {
      transform: scale(.96);
    }
    .updown button.went {
      border-color: var(--text);
    }
    .updown button.failed {
      border-color: var(--bad);
    }
    .updown .num {
      font-size: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    /* Two columns on a phone: narrower buttons, so the number between them still fits. */
    @container (max-width: 230px) {
      .updown .in {
        grid-template-columns: 38px minmax(0, 1fr) 38px;
        gap: 4px;
      }
      .updown .num {
        font-size: 15px;
      }
      .updown button {
        font-size: 18px;
      }
    }
    /* Too narrow for a button each side: the number on top, the two buttons under it. */
    @container (max-width: 150px) {
      .updown .in {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas: "mid mid" "less more";
        gap: 4px;
      }
      .updown .name {
        display: none;
      }
      .updown .num {
        font-size: 15px;
      }
      .updown button {
        font-size: 18px;
      }
    }

    /* A countdown */
    .countdown.soon .num {
      color: var(--accent);
    }
    .countdown.past .num {
      color: var(--bad);
    }

    /* A piece that cannot be used says so by how it looks, and in words when touched */
    .piece.off {
      opacity: .45;
      cursor: default;
    }
    .piece.off .fill {
      background: var(--dim);
    }
    .why {
      font-size: 11px;
      color: var(--dim);
      font-weight: 500;
    }

    /* Nothing to show, or something wrong with a canvas */
    .card {
      background: var(--panel);
      border-radius: 16px;
      padding: 18px;
      max-width: 620px;
      margin: 0 auto;
      width: 100%;
    }
    .card h2 {
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    .card p,
    .card li {
      font-size: 14px;
      color: var(--dim);
      margin: 0 0 10px;
      line-height: 1.45;
    }
    .card ul {
      margin: 0;
      padding-left: 18px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--rail);
    }
    .item div {
      flex: 1;
      min-width: 0;
    }
    .item b {
      display: block;
      font-weight: 500;
      font-size: 15px;
    }
    .item span {
      display: block;
      font-size: 13px;
      color: var(--dim);
      line-height: 1.4;
    }
    .item button.on {
      background: var(--accent);
      color: #000;
    }
    /* Arranging: the grid shows, pieces are chosen and dragged, and a sheet says what the chosen one is */
    #bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button.on {
      background: var(--accent);
      color: #000;
    }
    button.bad {
      color: var(--bad);
    }
    button:disabled {
      opacity: .4;
    }
    .cell {
      border: 1px dashed var(--rail);
      border-radius: 10px;
    }
    .slot {
      position: relative;
      min-width: 0;
      min-height: 0;
      border-radius: 14px;
      cursor: pointer;
    }
    .slot > .piece {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .slot:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }
    .sel {
      scroll-margin: 72px 0 calc(56dvh + 24px);
    }
    .slot.sel {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      touch-action: none;
      cursor: grab;
      z-index: 2;
    }
    .slot.clash::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px dashed var(--bad);
      border-radius: 14px;
      pointer-events: none;
    }
    .outline {
      position: relative;
      margin: -4px;
      border: 1px dashed var(--dim);
      border-radius: 16px;
      pointer-events: none;
    }
    .outline.sel {
      border: 2px solid var(--accent);
      z-index: 2;
    }
    .tab {
      position: absolute;
      top: -10px;
      left: 10px;
      max-width: calc(100% - 20px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 600;
      line-height: 18px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--rail);
      pointer-events: auto;
      cursor: pointer;
    }
    .sel .tab {
      background: var(--accent);
      color: #000;
      touch-action: none;
      cursor: grab;
    }
    .grip {
      position: absolute;
      right: -9px;
      bottom: -9px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--chassis);
      pointer-events: auto;
      touch-action: none;
      cursor: nwse-resize;
    }
    #panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 52dvh;
      overflow-y: auto;
      background: var(--panel);
      border-top: 1px solid var(--rail);
      border-radius: 18px 18px 0 0;
      padding: 14px max(14px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      display: grid;
      gap: 12px;
      z-index: 5;
    }
    body.sheeting {
      padding-bottom: 56dvh;
    }
    .pickHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .pickHead h2 {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
    }
    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
      font-size: 13px;
      color: var(--dim);
    }
    .field input[type="text"],
    .field input[type="number"],
    .field select,
    #picker input {
      font: inherit;
      font-size: 15px;
      color: var(--text);
      background: var(--rail);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 12px;
      min-height: 40px;
      width: 100%;
      min-width: 0;
    }
    .field input:focus-visible,
    #picker input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .field code {
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--text);
      overflow-wrap: anywhere;
      flex: 1;
      min-width: 0;
    }
    .field small {
      font-size: 12px;
    }
    .with {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .with input {
      flex: 1;
    }
    .parts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
    }
    .stepper {
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
    }
    .stepper b {
      min-width: 28px;
      text-align: center;
      color: var(--text);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .stepper button {
      min-width: 44px;
      font-size: 18px;
      padding: 4px;
    }
    .tick {
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      color: var(--text);
    }
    .tick input {
      width: 22px;
      height: 22px;
      accent-color: var(--accent);
    }
    .hint {
      margin: 0;
      font-size: 13px;
      color: var(--dim);
      line-height: 1.4;
    }
    #picker {
      position: fixed;
      inset: 0;
      z-index: 6;
      background: var(--chassis);
      padding: 14px max(14px, env(safe-area-inset-right)) 14px max(14px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
    }
    #pickList {
      overflow-y: auto;
      display: grid;
      align-content: start;
      gap: 6px;
    }
    .pick {
      display: grid;
      gap: 2px;
      text-align: left;
      background: var(--panel);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 500;
    }
    .pick span {
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--dim);
      overflow-wrap: anywhere;
    }
    @media (min-width: 900px) {
      #panel {
        left: auto;
        top: 0;
        width: 360px;
        max-height: none;
        border-top: 0;
        border-left: 1px solid var(--rail);
        border-radius: 0;
        align-content: start;
      }
      body.sheeting {
        padding-bottom: 72px;
        padding-right: 376px;
      }
      .sel {
        scroll-margin: 72px 0;
      }
      #picker {
        left: auto;
        width: 360px;
        border-left: 1px solid var(--rail);
        background: var(--panel);
      }
      .pick {
        background: var(--well);
      }
    }
    #said {
      z-index: 7;
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      margin: 0;
      max-width: min(560px, calc(100vw - 24px));
      background: var(--rail);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.35;
    }
    #said:empty {
      display: none;
    }
    #said.bad {
      color: var(--bad);
    }
    @media (max-width: 520px) {
      :root {
        --gap: 6px;
      }
      /* On a phone the light says it is connected. The word is kept for when it is not. */
      .led.on + #linkText {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      button.piece {
        transition: none;
      }
    }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="name"></h1>
        <details id="switcher" hidden>
          <summary id="switchName" aria-label="Canvas"></summary>
          <div
            id="switchList"></div>
        </details>
        <div id="layouts" role="group" aria-label="Layout" hidden><button type="button"
            data-which="desktop">Desktop</button><button type="button" data-which="mobile">Mobile</button></div>
        <button id="arrange" class="quiet" type="button" hidden>Edit</button>
        <div class="link"
          aria-live="polite"><i class="led" id="led"></i><span id="linkText">Connecting</span></div>
      </header>
      <div id="bar" hidden></div>
      <div id="pages" role="tablist" aria-label="Pages" hidden></div>
      <p id="notes"></p>
      <div id="scroll">
        <p id="proposedNote" hidden>
          Preview, not saved. Approve or decline it in the conversation. Controls are inactive until it is
          saved.
        </p>
        <div id="board"></div>
      </div>
      <section id="shelf" class="card" aria-label="Canvases" hidden></section>
      <section id="blank" class="card" hidden></section>
    </main>
    <section id="panel" aria-label="Element settings" hidden></section>
    <section id="picker" aria-label="Choose a value" hidden></section>
    <p id="said" role="status"></p>

    <script src="canvas.js"></script>
    <script src="starters.js"></script>
    <script src="changes.js"></script>
    <script src="arrange.js"></script>
    <script>
    // This page runs in the hub's sandbox. It has no network and no access to the hub's own pages. What it
    // knows arrives as a message from the page around it, and what it wants goes out the same way.
    //
    // A canvas is data. Every word in one is put on the page as text, never as markup, and nothing in one
    // is run. What a person may see and change is decided by the hub, whatever a canvas has on it.
    (() => {
      const C = globalThis.SkillfullyCanvas;
      const STARTERS = globalThis.SkillfullyCanvasStarters || [];
      const $ = (id) => document.getElementById(id);
      const toHub = (m) => parent.postMessage(m, "*");
      const el = (tag, props = {}, ...kids) => {
        const e = Object.assign(document.createElement(tag), props);
        e.append(...kids);
        return e;
      };

      let me = { slots: {} }, reach = { read: {}, write: {} }, defs = {}, plugins = [];
      let linked = false, greeted = false, answered = false, allowed = true;
      let canvases = []; // { id, doc, write, problems }
      let mayCreate = false, chosen = null, page = 0, shelf = false, ref = 0, shape = "";
      const values = new Map(); // device id -> Map(key -> value)
      const subs = new Map(); // "device|key" -> Set of functions to call with the new value
      const asked = new Map(); // ref -> { ok(message), fail(message) }
      let clocks = [], wanted = null;
      /** While a canvas is being arranged: the working copy and what is chosen on it. See arrange.js. */
      let arr = null;

      // --- Saying things ---

      let saidTimer;
      function say(text, bad) {
        $("said").textContent = text || "";
        $("said").classList.toggle("bad", !!bad);
        clearTimeout(saidTimer);
        if (text) saidTimer = setTimeout(() => ($("said").textContent = ""), 5000);
      }

      // --- What a piece is tied to ---

      const valueOf = (plugin, key) => (values.get(plugin) || new Map()).get(key);
      function watch(plugin, key, fn) {
        const id = plugin + "|" + key;
        if (!subs.has(id)) subs.set(id, new Set());
        subs.get(id).add(fn);
        fn(valueOf(plugin, key));
      }

      /**
       * One value or action of one device, as this person stands to it: whether there is a device for it,
       * whether they may see it, whether they may change it, and the words for why not.
       */
      function tie(key, named, missing) {
        if (missing && missing.length) {
          const what = missing.join(" and ");
          return {
            short: "Not assigned",
            words: `No ${what} assigned to you. Ask your hub admin.`,
          };
        }
        const plugin = C.deviceFor(plugins, key, named);
        if (!plugin) {
          return {
            short: "No device",
            words: named
              ? `Device not connected to this screen: ${named}.`
              : `No device with ${key.slice(0, key.indexOf("/"))} values is connected to this screen.`,
          };
        }
        if (!C.may(reach.read, key)) {
          return { short: "No access", words: "You do not have permission to view this." };
        }
        const info = C.describe(key, defs, plugin);
        const cant = plugin.status !== "running"
          ? `${plugin.name} is stopped.`
          : plugin.mode !== "act"
          ? `${plugin.name} is read-only.`
          : !C.may(reach.write, key) || (info && !info.writable)
          ? "View only: you cannot change this."
          : "";
        return {
          plugin,
          key,
          info,
          cant,
          get: () => valueOf(plugin.id, key),
          watch: (fn) => watch(plugin.id, key, fn),
        };
      }

      function send(t, value, on) {
        if (!linked) return say("Not sent: disconnected from the hub.", true);
        asked.set(++ref, on || {});
        toHub({ type: "set", plugin: t.plugin.id, key: t.key, value, ref });
        return ref;
      }

      /** Put words into an element: the words themselves, or a value of a device shown as words. */
      function words(into, text) {
        if (text === undefined) return;
        if (typeof text === "string") return void (into.textContent = text);
        const t = tie(text.key, text.device);
        if (t.plugin) t.watch((v) => (into.textContent = v == null ? "" : String(v)));
      }
      /** The name on a piece: what its canvas says, or failing that what the device calls it. */
      function title(into, p, t) {
        if (p.title !== undefined) return words(into, p.title);
        if (!t.plugin) return void (into.textContent = p.key.slice(p.key.lastIndexOf("/") + 1));
        if (t.info && t.info.titleKey) {
          return watch(t.plugin.id, t.info.titleKey, (v) => (into.textContent = v == null ? "" : String(v)));
        }
        into.textContent = (t.info && t.info.title) || p.key.slice(p.key.lastIndexOf("/") + 1);
      }
      const shown = (v, info) =>
        v == null || v === ""
          ? "—"
          : typeof v === "boolean"
          ? (v ? "On" : "Off")
          : String(v) + (info && info.unit ? (info.unit === "%" ? "%" : " " + info.unit) : "");
      const same = (a, b) => a === b || (a != null && b != null && String(a) === String(b));

      // --- The pieces ---

      const where = (e, p) => {
        e.style.gridColumn = p.col + " / span " + p.wide;
        e.style.gridRow = p.row + " / span " + p.tall;
        return e;
      };
      const placed = (e, p) => {
        e.classList.add("piece");
        return where(e, p);
      };
      /** A piece that cannot be used looks it, and says why when it is touched. */
      function off(e, t) {
        e.classList.add("off");
        e.append(el("span", { className: "why", textContent: t.short }));
        e.addEventListener("click", () => say(t.words));
        return e;
      }

      function label(p) {
        const e = el("div", { className: "label " + (p.size || "normal") });
        words(e, p.text);
        return e;
      }

      function readout(p) {
        const t = tie(p.key, p.device, p.missing);
        const name = el("span", { className: "name" }), num = el("span", { className: "num", textContent: "—" });
        const e = el("div", { className: "readout" + (asOnPhone(p).tall > 1 ? " tall" : "") }, name, num);
        title(name, p, t);
        if (!t.plugin) return off(e, t);
        t.watch((v) => (num.textContent = shown(v, t.info)));
        return e;
      }

      /** What a button or a switch does when the hub answers. */
      const answer = (e) => ({
        ok: (m) => {
          if (m.superseded) return;
          e.classList.add("went");
          setTimeout(() => e.classList.remove("went"), 350);
        },
        fail: (m) => {
          e.classList.add("failed");
          setTimeout(() => e.classList.remove("failed"), 1500);
          say(m.error.message, true);
        },
      });

      function button(p) {
        if (p.steps) return steps(p);
        const t = tie(p.key, p.device, p.missing);
        const name = el("span");
        const e = el("button", { type: "button", className: p.color || "" }, name);
        if (p.color) e.classList.add("tinted");
        title(name, p, t);
        if (!t.plugin) return off(e, t);
        if (p.lit) {
          const l = tie(p.lit.key, p.lit.device ?? p.device, p.missing);
          if (l.plugin) l.watch((v) => e.classList.toggle("lit", same(v, p.lit.is)));
        }
        const value = p.value === undefined
          ? true
          : typeof p.value === "object"
          ? JSON.stringify(p.value)
          : p.value;
        e.onclick = () => t.cant ? say(t.cant) : send(t, value, answer(e));
        if (t.cant) e.classList.add("off");
        return e;
      }

      /**
       * A button that does several things in turn: sets values, runs actions, waits between them. Each step
       * is sent once the hub has answered the one before, so they arrive in order. It stops at the first one
       * that fails, and says which. Nothing is sent unless every step is this person's to do.
       */
      function steps(p) {
        const name = el("span");
        const e = el("button", { type: "button", className: p.color || "" }, name);
        if (p.color) e.classList.add("tinted");
        words(name, p.title);
        const ties = p.steps.map((st) => st.wait !== undefined ? null : tie(st.key, st.device, p.missing));
        const lost = ties.find((t) => t && !t.plugin);
        if (lost) return off(e, lost);
        const cant = ties.find((t) => t && t.cant)?.cant ?? "";
        if (p.lit) {
          const l = tie(p.lit.key, p.lit.device, p.missing);
          if (l.plugin) l.watch((v) => e.classList.toggle("lit", same(v, p.lit.is)));
        }
        if (cant) e.classList.add("off");
        let running = false;
        e.onclick = async () => {
          if (cant) return say(cant);
          if (running) return;
          running = true;
          e.classList.add("busy");
          e.setAttribute("aria-busy", "true");
          try {
            for (const [i, st] of p.steps.entries()) {
              if (st.wait !== undefined) {
                await new Promise((go) => setTimeout(go, st.wait * 1000));
                continue;
              }
              const value = st.value === undefined
                ? true
                : typeof st.value === "object"
                ? JSON.stringify(st.value)
                : st.value;
              const m = await new Promise((done) => {
                const timer = setTimeout(() => done({ late: true }), 15000);
                const sent = send(ties[i], value, {
                  ok: (m) => (clearTimeout(timer), done(m)),
                  fail: (m) => (clearTimeout(timer), done(m)),
                });
                if (sent === undefined) (clearTimeout(timer), done({ away: true }));
              });
              if (m.away) return;
              if (m.late || !m.ok && m.error) {
                e.classList.add("failed");
                setTimeout(() => e.classList.remove("failed"), 1500);
                const why = m.late ? "no answer from the hub" : m.error.message;
                return say(`Stopped at step ${i + 1} of ${p.steps.length}: ${why}`, true);
              }
            }
            e.classList.add("went");
            setTimeout(() => e.classList.remove("went"), 350);
          } finally {
            running = false;
            e.classList.remove("busy");
            e.removeAttribute("aria-busy");
          }
        };
        return e;
      }

      function toggle(p) {
        const t = tie(p.key, p.device, p.missing);
        const on = p.on === undefined ? true : p.on, offValue = p.off === undefined ? false : p.off;
        const name = el("span"), state = el("span", { className: "state" });
        const e = el("button", { type: "button", className: p.color || "" }, name, state);
        title(name, p, t);
        if (!t.plugin) return off(e, t);
        let now;
        t.watch((v) => {
          now = v;
          const is = same(v, on);
          e.classList.toggle("lit", is);
          e.setAttribute("aria-pressed", String(is));
          state.textContent = v == null ? "—" : is ? "On" : "Off";
        });
        e.onclick = () => t.cant ? say(t.cant) : send(t, same(now, on) ? offValue : on, answer(e));
        if (t.cant) e.classList.add("off");
        return e;
      }

      // A canvas is laid out for a phone, where it fills the screen. On a wider screen, a tablet on a
      // stand, a computer, a monitor in full screen, it fills the room there is too: everything on it is
      // made larger together, though never so large that a button is the size of a hand, and then the
      // columns widen and the rows grow until the grid reaches the edges. Arranging keeps the rows as drawn,
      // so the empty rows below stay the size a piece will be.
      let drawnPlan = null;
      /**
       * How many of a phone's cells a piece would take, for a piece that looks one way when small and
       * another when large. A desktop grid's cells are finer: a phone's row is about two of them, its
       * column about four.
       */
      const asOnPhone = (p) =>
        drawnPlan?.fixed
          ? { wide: Math.max(1, Math.round(p.wide * 32 / 140)), tall: Math.max(1, Math.round(p.tall * 32 / 68)) }
          : p;
      const LARGEST = 1.75, TALLEST = 3;
      function roomFor(plan) {
        drawnPlan = plan;
        const natural = plan.columns * 132;
        board.style.zoom = "";
        board.style.width = "";
        board.style.maxWidth = natural + "px";
        board.style.removeProperty("--row");
        board.classList.toggle("fixed", plan.fixed);
        board.style.setProperty("--rows", plan.rows);
        if (plan.fixed) {
          // A desktop layout is drawn whole, as large as fits, the same on every screen but for its size.
          board.style.maxWidth = "none";
          const style = getComputedStyle(board);
          const cell = parseFloat(style.gridAutoRows) || 28, gap = parseFloat(style.rowGap) || 0;
          const wide = plan.columns * cell + (plan.columns - 1) * gap;
          const tall = plan.rows * cell + (plan.rows - 1) * gap;
          const roomWide = $("scroll").clientWidth - 8;
          const roomTall = innerHeight - board.getBoundingClientRect().top - 16;
          const fits = Math.min(roomWide / wide, roomTall / tall);
          board.style.width = wide + "px";
          board.style.zoom = String(Number(Math.max(0.2, fits).toFixed(3)));
          return;
        }
        const style = getComputedStyle(board);
        const row = parseFloat(style.gridAutoRows), gap = parseFloat(style.rowGap);
        const rows = Math.max(1, ...plan.pieces.map((p) => p.row + p.tall - 1));
        const tall = rows * row + (rows - 1) * gap;
        const roomWide = $("scroll").clientWidth - 8;
        const roomTall = innerHeight - board.getBoundingClientRect().top - 16;
        const larger = Math.max(1, Math.min(LARGEST, roomWide / natural, roomTall / tall));
        // A phone, or a window no wider than the canvas was drawn for: as drawn.
        if (roomWide <= natural * 1.05) return;
        if (larger > 1.01) board.style.zoom = String(Number(larger.toFixed(3)));
        board.style.maxWidth = "none";
        board.style.width = Math.floor(roomWide / larger) + "px";
        if (arr) return;
        const each = (roomTall / larger - (rows - 1) * gap) / rows;
        if (each > row) board.style.setProperty("--row", Math.min(each, row * TALLEST).toFixed(1) + "px");
      }
      addEventListener("resize", () => drawnPlan && roomFor(drawnPlan));

      function slider(p) {
        const t = tie(p.key, p.device, p.missing);
        const up = p.tall > p.wide;
        const name = el("span", { className: "name" }), num = el("span", { className: "num", textContent: "—" });
        const fill = el("i", { className: "fill" }), thumb = el("i", { className: "thumb" });
        const track = el("div", { className: "track" }, fill, thumb);
        const e = el(
          "div",
          { className: "slider " + (up ? "up" : "across") },
          name,
          ...(up ? [track, num] : [num, track]),
        );
        title(name, p, t);
        if (!t.plugin) return off(e, t);

        const info = t.info || {};
        const r = { min: p.min ?? info.min ?? 0, max: p.max ?? info.max ?? 100, unit: info.unit };
        r.step = p.step ?? C.stepFor(r);
        const text = (v) =>
          r.unit === "dB"
            ? (v <= r.min ? "Off" : (v > 0 ? "+" : "") + v.toFixed(1))
            : (r.step < 1 ? String(Number(v.toFixed(2))) : String(Math.round(v))) + (r.unit === "%" ? "%" : "");

        let value = null, held = null, dragging = false, quietUntil = 0;
        let lastSent = 0, queued = null, waiting = null, mine = 0, heard = 0;
        // A slider tied to an action does the action once, with the number, when it is let go. Doing it
        // at every step of the way would be the device told to do something thirty times a second.
        const asked = typeof p.sends === "string" && p.sends ? p.sends : null;
        function paint() {
          const known = typeof value === "number";
          const at = known ? C.toPlace(value, r) * 100 + "%" : "0%";
          if (up) (fill.style.height = at), (thumb.style.bottom = at);
          else (fill.style.width = at), (thumb.style.left = at);
          num.textContent = known ? text(value) : "—";
          thumb.hidden = !known;
          if (known) {
            e.setAttribute("aria-valuenow", value);
            e.setAttribute("aria-valuetext", text(value) + (r.unit && r.unit !== "%" ? " " + r.unit : ""));
          }
        }
        e.setAttribute("role", "slider");
        e.setAttribute("aria-valuemin", r.min);
        e.setAttribute("aria-valuemax", r.max);
        e.setAttribute("aria-orientation", up ? "vertical" : "horizontal");
        e.tabIndex = 0;
        // A name that arrives later is still the name a screen reader says.
        new MutationObserver(() => e.setAttribute("aria-label", name.textContent)).observe(name, {
          childList: true,
          characterData: true,
          subtree: true,
        });
        e.setAttribute("aria-label", name.textContent);

        // Where it rests comes from the value itself, or for an action from the reading it was given.
        const shown = asked ? (p.shows ? tie(p.shows.key, p.shows.device ?? p.device, p.missing) : null) : t;
        if (asked && !shown) (value = r.min), (held = r.min);
        (shown && shown.plugin ? shown : { watch() {} }).watch((v) => {
          // A device may report a number as words.
          if (asked && typeof v === "string" && v.trim() !== "" && Number.isFinite(Number(v))) v = Number(v);
          if (typeof v !== "number") return;
          held = v;
          // While a thumb is on the slider, the thumb is in charge. Otherwise the device is.
          if (!dragging && performance.now() > quietUntil) {
            value = v;
            paint();
          }
        });
        paint();
        if (t.cant) {
          e.classList.add("off");
          e.addEventListener("click", () => say(t.cant));
          return e;
        }

        const push = (v) => {
          lastSent = performance.now();
          mine = send(t, v, {
            ok: (m, at) => {
              heard = Math.max(heard, at);
              if (m.superseded) return;
              held = m.value;
              if (at === mine && !dragging) {
                value = m.value;
                paint();
              }
            },
            fail: (m, at) => {
              heard = Math.max(heard, at);
              say(m.error.message, true);
              quietUntil = 0;
              if (!dragging) {
                value = held;
                paint();
              }
            },
          }) || mine;
        };
        // Let go of, a slider tied to an action does it: the number, in the option it was told to use.
        const ask = () => {
          if (!asked || typeof value !== "number") return;
          const n = Number((Math.round(value / r.step) * r.step).toFixed(6));
          value = n;
          paint();
          // The device's own report of it takes a moment to follow. Until then the slider stays put.
          quietUntil = performance.now() + 2500;
          send(t, JSON.stringify({ [asked]: n }), {
            ok: () => {},
            fail: (m) => {
              say(m.error.message, true);
              quietUntil = 0;
              value = held;
              paint();
            },
          });
        };
        // At most one message every 33 ms, and only ever the newest. The hub keeps only the newest too.
        const move = (v) => {
          value = v;
          paint();
          quietUntil = performance.now() + 400;
          if (asked) return;
          const now = performance.now();
          if (now - lastSent < 33) {
            queued = v;
            if (!waiting) {
              waiting = setTimeout(() => {
                waiting = null;
                const q = queued;
                queued = null;
                if (q !== null) push(q);
              }, 33 - (now - lastSent));
            }
            return;
          }
          queued = null;
          push(v);
        };
        const fromPointer = (ev) => {
          const box = track.getBoundingClientRect();
          return C.fromPlace(
            up ? 1 - (ev.clientY - box.top) / box.height : (ev.clientX - box.left) / box.width,
            r,
          );
        };
        e.addEventListener("pointerdown", (ev) => {
          dragging = true;
          e.setPointerCapture(ev.pointerId);
          move(fromPointer(ev));
        });
        e.addEventListener("pointermove", (ev) => dragging && move(fromPointer(ev)));
        const release = () => {
          // Moved by hand, it is let go of when the hand lets go. Left holding the keyboard, the next arrow,
          // Home or End pressed for something else would move it. Someone who came to it by keyboard keeps it.
          if (dragging && document.activeElement === e) e.blur();
          if (asked) {
            if (dragging) ask();
            dragging = false;
            return;
          }
          dragging = false;
          // If the device has already answered the last thing sent, show what it holds now.
          if (queued === null && heard === mine && typeof held === "number") {
            value = held;
            paint();
          }
        };
        e.addEventListener("pointerup", release);
        e.addEventListener("pointercancel", release);
        e.addEventListener("keydown", (ev) => {
          const big = (r.max - r.min) / 10;
          const by = {
            ArrowRight: r.step,
            ArrowUp: r.step,
            ArrowLeft: -r.step,
            ArrowDown: -r.step,
            PageUp: big,
            PageDown: -big,
          }[ev.key];
          const from = typeof value === "number" ? value : r.min;
          if (ev.key === "Home") move(r.min);
          else if (ev.key === "End") move(r.max);
          else if (by) move(Math.min(r.max, Math.max(r.min, Number((from + by).toFixed(6)))));
          else return;
          ev.preventDefault();
        });
        // Moved with the keys, it is let go of when the key is.
        if (asked) e.addEventListener("keyup", (ev) => /^(Arrow|Page|Home|End)/.test(ev.key) && ask());
        return e;
      }

      /** A number, from a device that may report one as words. Anything else is not a number. */
      const asNumber = (v) =>
        typeof v === "number" && Number.isFinite(v)
          ? v
          : typeof v === "string" && v.trim() !== "" && Number.isFinite(Number(v))
          ? Number(v)
          : null;
      /** A piece's name, once it has one, is what a screen reader calls it. */
      function calledBy(e, name) {
        const set = () => e.setAttribute("aria-label", name.textContent);
        new MutationObserver(set).observe(name, { childList: true, characterData: true, subtree: true });
        set();
      }
      /** For a piece tied to an action: the value that says what it is now. For one tied to a value: that value. */
      const standing = (p, t) =>
        p.sends ? (p.shows ? tie(p.shows.key, p.shows.device ?? p.device, p.missing) : null) : t;

      // A number shown as a bar. Nothing can be changed from it: it is for looking at.
      function meter(p) {
        const t = tie(p.key, p.device, p.missing);
        const up = p.tall > p.wide;
        const name = el("span", { className: "name" }), num = el("span", { className: "num", textContent: "—" });
        const fill = el("i", { className: "fill" });
        const track = el("div", { className: "track" }, fill);
        const e = el(
          "div",
          { className: "meter " + (up ? "up" : "across") + (p.color ? " " + p.color : "") },
          name,
          ...(up ? [track, num] : [num, track]),
        );
        title(name, p, t);
        if (!t.plugin) return off(e, t);
        const info = t.info || {};
        const r = { min: p.min ?? info.min ?? 0, max: p.max ?? info.max ?? 100, unit: info.unit };
        e.setAttribute("role", "meter");
        e.setAttribute("aria-valuemin", r.min);
        e.setAttribute("aria-valuemax", r.max);
        calledBy(e, name);
        t.watch((v) => {
          const n = asNumber(v);
          const at = n === null ? "0%" : C.toPlace(Math.min(r.max, Math.max(r.min, n)), r) * 100 + "%";
          if (up) fill.style.height = at;
          else fill.style.width = at;
          num.textContent = n === null ? "—" : shown(n, info);
          if (n !== null) e.setAttribute("aria-valuenow", n);
        });
        return e;
      }

      // A light: lit while a value is one thing. On air, recording, live, muted.
      function light(p) {
        const t = tie(p.key, p.device, p.missing);
        const name = el("span", { className: "name" });
        const e = el(
          "div",
          { className: "light" + (asOnPhone(p).tall > 1 ? " tall" : "") + (p.color ? " " + p.color : "") },
          el("i", { className: "dot" }),
          name,
        );
        title(name, p, t);
        if (!t.plugin) return off(e, t);
        const is = p.is === undefined ? true : p.is;
        e.setAttribute("role", "status");
        t.watch((v) => {
          const lit = same(v, is);
          e.classList.toggle("lit", lit);
          e.setAttribute("aria-label", name.textContent + (lit ? ": on" : ": off"));
        });
        return e;
      }

      // One of a few, with the one in use lit: an input, a scene, a mode.
      function choice(p) {
        const t = tie(p.key, p.device, p.missing);
        const up = p.tall > p.wide;
        const name = el("span", { className: "name" });
        const row = el("div", { className: "options" });
        const e = el(
          "div",
          {
            className: "choice " + (up ? "up" : "across") +
              (!up && p.options.length > asOnPhone(p).wide + 1 ? " many" : "") +
              (p.color ? " " + p.color : ""),
          },
          name,
          row,
        );
        title(name, p, t);
        if (!t.plugin) return off(e, t);
        e.setAttribute("role", "radiogroup");
        calledBy(e, name);
        const segments = p.options.map((o) => {
          const b = el("button", { type: "button" }, el("span", { textContent: o.title ?? String(o.value) }));
          b.setAttribute("role", "radio");
          b.setAttribute("aria-checked", "false");
          row.append(b);
          return { o, b };
        });
        const mark = (v) => {
          for (const { o, b } of segments) {
            const on = same(v, o.value);
            b.classList.toggle("lit", on);
            b.setAttribute("aria-checked", String(on));
          }
        };
        const by = standing(p, t);
        if (by && by.plugin) by.watch(mark);
        for (const { o, b } of segments) {
          b.onclick = () => {
            if (t.cant) return say(t.cant);
            // With nothing to say which is in use, the one pressed is taken to be.
            if (p.sends && !p.shows) mark(o.value);
            send(t, p.sends ? JSON.stringify({ [p.sends]: o.value }) : o.value, answer(b));
          };
        }
        if (t.cant) e.classList.add("off");
        return e;
      }

      // A number with a button each side, to take it down or up by a step.
      function stepper(p) {
        const t = tie(p.key, p.device, p.missing);
        const name = el("span", { className: "name" }), num = el("span", { className: "num", textContent: "—" });
        const less = el("button", { type: "button", className: "less", textContent: "−" });
        const more = el("button", { type: "button", className: "more", textContent: "+" });
        const e = el(
          "div",
          { className: "updown" },
          el("div", { className: "in" }, less, el("div", { className: "mid" }, name, num), more),
        );
        title(name, p, t);
        if (!t.plugin) return off(e, t);
        const info = t.info || {};
        const r = { min: p.min ?? info.min, max: p.max ?? info.max, step: p.step ?? 1 };
        let value = null, held = null;
        const paint = () => (num.textContent = value === null ? "—" : shown(value, info));
        const by = standing(p, t);
        if (by && by.plugin) {
          by.watch((v) => {
            const n = asNumber(v);
            if (n === null) return;
            value = held = n;
            paint();
          });
        }
        const go = (step, b) => {
          if (t.cant) return say(t.cant);
          // Not known yet: it starts from the end it is moving away from.
          const from = value ?? (step > 0 ? r.min : r.max) ?? 0;
          let next = Number((from + step).toFixed(6));
          if (r.min !== undefined) next = Math.max(r.min, next);
          if (r.max !== undefined) next = Math.min(r.max, next);
          if (next === value) return;
          value = next;
          paint();
          const told = answer(b);
          send(t, p.sends ? JSON.stringify({ [p.sends]: next }) : next, {
            ok: told.ok,
            fail: (m) => {
              told.fail(m);
              value = held;
              paint();
            },
          });
        };
        less.onclick = () => go(-r.step, less);
        more.onclick = () => go(r.step, more);
        const named_ = () => {
          less.setAttribute("aria-label", "Less " + name.textContent);
          more.setAttribute("aria-label", "More " + name.textContent);
        };
        new MutationObserver(named_).observe(name, { childList: true, characterData: true, subtree: true });
        named_();
        if (t.cant) e.classList.add("off");
        paint();
        return e;
      }

      // A countdown to a time of day, such as when a service starts. After it, it counts up.
      function countdown(p) {
        const num = el("span", { className: "num" });
        const e = el("div", { className: "clock countdown" }, num);
        if (p.title !== undefined) {
          const name = el("span", { className: "name" });
          words(name, p.title);
          e.prepend(name);
        }
        e.style.setProperty("--letters", 8);
        const [h, m] = p.until.split(":").map(Number);
        clocks.push(() => {
          const now = new Date();
          const at = new Date(now);
          at.setHours(h, m, 0, 0);
          let left = Math.round((at - now) / 1000);
          // Long past the time, it is counting to the same time tomorrow.
          if (left < -2 * 3600) {
            at.setDate(at.getDate() + 1);
            left = Math.round((at - now) / 1000);
          }
          const past = left < 0, s = Math.abs(left);
          const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
          num.textContent = (past ? "+" : "") + (hh ? hh + ":" + String(mm).padStart(2, "0") : String(mm)) +
            ":" + String(ss).padStart(2, "0");
          e.classList.toggle("past", past);
          e.classList.toggle("soon", !past && left <= 300);
        });
        return e;
      }

      // A button that goes to another page of this canvas.
      function goto(p) {
        const name = el("span");
        const e = el(
          "button",
          { type: "button", className: "goto" + (p.color ? " tinted " + p.color : "") },
          name,
        );
        if (p.title !== undefined) words(name, p.title);
        else name.textContent = p.page;
        e.onclick = () => {
          const face = faceOf(current());
          const i = face ? face.pages.findIndex((pg) => pg.name === p.page) : -1;
          if (i < 0) return say(`This canvas has no page called ${p.page}.`);
          page = i;
          draw();
        };
        return e;
      }

      function clock(p) {
        const num = el("span", { className: "num" });
        const e = el("div", { className: "clock" }, num);
        if (p.title !== undefined) {
          const name = el("span", { className: "name" });
          words(name, p.title);
          e.prepend(name);
        }
        e.style.setProperty("--letters", p.seconds ? 11 : 8);
        clocks.push(() => (num.textContent = new Date().toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
          ...(p.seconds ? { second: "2-digit" } : {}),
        })));
        return e;
      }

      /** A group with a title is drawn as a card behind its pieces. One without is only a way to lay them out. */
      function backdrop(p) {
        if (p.title === undefined) return null;
        const e = el("div", { className: "back" });
        words(e, p.title);
        return e;
      }
      const MAKE = {
        label,
        readout,
        button,
        toggle,
        slider,
        meter,
        light,
        choice,
        stepper,
        countdown,
        goto,
        clock,
        group: backdrop,
      };
      setInterval(() => clocks.forEach((tick) => tick()), 1000);

      // --- Drawing ---

      // A canvas that has been put to this person for a yes or a no, and is not kept yet. While there is
      // one, it is what is drawn, so they can look at it first. Nothing on it works until it is saved.
      let proposed = null;
      const current = () => (!arr && proposed) || canvases.find((c) => c.id === chosen) || null;

      // Which layout a canvas is shown in. A screen as wide as a computer's shows the desktop layout, when
      // the canvas has one, and anything narrower the mobile one. Either can be chosen instead, here.
      let wantWhich = null;
      const roomy = () => innerWidth >= 900;
      /** The layout a canvas is shown in: "desktop" or "mobile". */
      function whichFor(c) {
        if (arr) return arr.which;
        if (!c || c.problems.length) return "mobile";
        return wantWhich ?? (roomy() && c.doc.desktop ? "desktop" : "mobile");
      }
      /** The layout a canvas is shown in, as a canvas of its own. Null when it has no desktop layout yet. */
      const faceOf = (c) => arr ? arr.doc : c ? C.face(c.doc, whichFor(c)) : null;
      /** Show the other layout, on the page of the same name when it has one. */
      function showWhich(which) {
        const c = current();
        const before = faceOf(c);
        const name = before?.pages[arr ? arr.page : page]?.name;
        wantWhich = which;
        if (arr) arr.setWhich(which);
        const after = faceOf(c);
        const same = after ? after.pages.findIndex((pg) => pg.name === name) : -1;
        if (arr) {
          if (same >= 0) arr.setPage(same);
        } else page = Math.max(0, same);
        draw();
      }
      for (const b of document.querySelectorAll("#layouts button")) b.onclick = () => showWhich(b.dataset.which);
      // Full screen, as the hub's page tells it: the canvas is its controls and nothing else.
      let full = false;
      let wasRoomy = roomy();
      addEventListener("resize", () => {
        if (roomy() === wasRoomy) return;
        wasRoomy = roomy();
        if (!arr && wantWhich === null) draw();
      });

      /** The canvases this person has any use for. Someone who may change them sees them all. */
      function forMe(c) {
        if (c.write) return true;
        if (c.problems.length) return false;
        let tied = 0;
        for (const face of [c.doc, C.face(c.doc, "desktop")]) {
          for (let i = 0; face && i < face.pages.length; i++) {
            for (const p of C.layout(face, i, me.slots || {}).pieces) {
              const keys = p.steps ? p.steps.filter((st) => st.key).map((st) => st.key) : p.key ? [p.key] : [];
              for (const key of keys) {
                tied++;
                if (p.missing.length || C.may(reach.read, key)) return true;
              }
            }
          }
        }
        return tied === 0;
      }

      function drawHead() {
        const c = current();
        const showing = !arr && !!proposed;
        // The name of the canvas shown. With others to go to, or a new one to start, it opens a list of them.
        const many = (canvases.length > 1 || (mayCreate && canvases.length > 0)) && !arr && !showing;
        $("proposedNote").hidden = !showing;
        $("board").inert = showing;
        $("name").hidden = many;
        $("switcher").hidden = !many;
        const named = arr ? arr.doc.name : c ? c.doc.name || c.id : "Canvas";
        $("name").textContent = named;
        const label = $("switchName");
        label.innerHTML = "";
        label.append(
          el("span", { textContent: shelf ? "New canvas" : named }),
          chevron(),
        );
        const menu = $("switchList");
        menu.innerHTML = "";
        for (const x of canvases) {
          const b = el("button", { type: "button", textContent: String(x.doc.name || x.id) });
          b.dataset.id = x.id;
          if (x.id === chosen && !shelf) b.setAttribute("aria-current", "true");
          b.onclick = () => {
            $("switcher").open = false;
            chosen = x.id;
            page = 0;
            shelf = false;
            draw();
          };
          menu.append(b);
        }
        if (mayCreate) {
          const b = el("button", {
            type: "button",
            className: "new",
            id: "newCanvas",
            textContent: "+ New canvas",
          });
          b.onclick = () => {
            $("switcher").open = false;
            shelf = true;
            toHub({ type: "docs", ref: ++ref }); // a file someone wrote a moment ago is picked up here
            draw();
          };
          menu.append(b);
        }
        $("arrange").hidden = !!arr || shelf || !c || !c.write || !!c.problems.length;
        // The two layouts, for a canvas that has both, and for anyone who may arrange one.
        const layouts = $("layouts");
        layouts.hidden = shelf || showing || !c || !!c.problems.length || !(arr || c.doc.desktop || c.write);
        const which = whichFor(c);
        for (const b of layouts.querySelectorAll("button")) {
          b.setAttribute("aria-pressed", String(b.dataset.which === which));
        }

        const pages = $("pages");
        pages.innerHTML = "";
        const face = faceOf(c);
        const list = arr ? arr.doc.pages : face && !c.problems.length ? face.pages : [];
        const on = arr ? arr.page : page;
        pages.hidden = (list.length < 2 && !arr) || shelf;
        list.forEach((pg, i) => {
          const b = el("button", { type: "button", textContent: pg.name });
          b.setAttribute("role", "tab");
          b.setAttribute("aria-selected", String(i === on));
          b.onclick = () => {
            if (arr) return arr.setPage(i);
            page = i;
            draw();
          };
          pages.append(b);
        });
        if (arr) {
          const b = el("button", { type: "button", id: "addPage", textContent: "+ Page" });
          b.onclick = () => arr.addPage();
          pages.append(b);
        }
      }

      /**
       * The board while it is being arranged: every cell shown, every piece drawn as it is in use but
       * unable to act, and each wrapped in something that can be chosen and dragged. A group shows as an
       * outline with a tab to take hold of.
       */
      function drawArranging(board, plan) {
        for (let row = 1; row <= (plan.fixed ? plan.rows : plan.rows + 2); row++) {
          for (let col = 1; col <= plan.columns; col++) {
            board.append(where(el("i", { className: "cell" }), { col, row, wide: 1, tall: 1 }));
          }
        }
        // Two pieces on the same cell are allowed, and shown, since it is rarely what was meant.
        const on = new Map();
        for (const p of plan.pieces) {
          if (p.type === "group") continue;
          for (let x = p.col; x < p.col + p.wide; x++) {
            for (let y = p.row; y < p.row + p.tall; y++) on.set(x + "," + y, (on.get(x + "," + y) || 0) + 1);
          }
        }
        const clashes = (p) => {
          for (let x = p.col; x < p.col + p.wide; x++) {
            for (let y = p.row; y < p.row + p.tall; y++) if (on.get(x + "," + y) > 1) return true;
          }
          return false;
        };
        let gripped = false;
        const grip = (e, p) => {
          if (gripped || (p.path !== arr.touched && plan.pieces.some((x) => x.path === arr.touched))) return;
          gripped = true;
          e.append(el("i", { className: "grip" }));
        };
        for (const p of plan.pieces) {
          const chosen = C.edit.written(p.path) === arr.selected;
          if (p.type === "group") {
            const written = C.edit.spot(arr.doc, arr.page, p.path).piece;
            const r = written.repeat;
            const times = r ? (r.each ? r.each.length : r.to - r.from + 1) : 0;
            const tab = el("span", {
              className: "tab",
              tabIndex: 0,
              textContent: (typeof p.title === "string" && p.title ? p.title : "Group") +
                (times ? " × " + times : ""),
            });
            tab.setAttribute("role", "button");
            const box = where(el("div", { className: "outline" + (chosen ? " sel" : "") }, tab), p);
            box.dataset.path = p.path;
            if (chosen) grip(box, p);
            board.append(box);
            continue;
          }
          const made = MAKE[p.type](p);
          made.classList.add("piece");
          made.inert = true;
          const slot = where(
            el(
              "div",
              { className: "slot" + (chosen ? " sel" : "") + (clashes(p) ? " clash" : ""), tabIndex: 0 },
              made,
            ),
            p,
          );
          slot.dataset.path = p.path;
          slot.setAttribute("role", "button");
          slot.setAttribute(
            "aria-label",
            p.type + (made.textContent ? ": " + made.textContent.trim().slice(0, 60) : ""),
          );
          slot.setAttribute("aria-pressed", String(chosen));
          if (chosen) grip(slot, p);
          board.append(slot);
        }
      }

      function drawBoard() {
        const board = $("board"), blank = $("blank"), notes = $("notes");
        subs.clear();
        clocks = [];
        board.innerHTML = "";
        blank.innerHTML = "";
        notes.innerHTML = "";
        const c = current();
        document.body.classList.toggle("sheeting", !!arr && !$("panel").hidden);
        if (arr) {
          $("scroll").hidden = false;
          blank.hidden = true;
          const plan = C.layout(arr.doc, arr.page, me.slots || {});
          board.style.setProperty("--cols", plan.columns);
          roomFor(plan);
          drawArranging(board, plan);
          clocks.forEach((tick) => tick());
          return;
        }
        $("scroll").hidden = !c || !!c.problems.length || shelf;
        blank.hidden = shelf || !!(c && !c.problems.length);
        if (shelf) return;
        if (!c) {
          if (!greeted || !answered) return void (blank.hidden = true);
          blank.append(
            el("h2", { textContent: "No canvases" }),
            el("p", {
              textContent: allowed
                ? "No one has created a canvas yet. People with permission to create canvases can start one here."
                : "You do not have access to any canvases. Ask your hub admin.",
            }),
          );
          return;
        }
        if (c.problems.length) {
          blank.append(
            el("h2", { textContent: "Canvas has errors" }),
            el("p", { textContent: `Errors in ${c.id}.json:` }),
            el("ul", {}, ...c.problems.map((problem) => el("li", { textContent: problem }))),
          );
          return;
        }
        const face = faceOf(c);
        if (!face) {
          // Desktop chosen for a canvas drawn only for a phone.
          $("scroll").hidden = true;
          blank.hidden = false;
          blank.append(
            el("h2", { textContent: "No desktop layout" }),
            el("p", {
              textContent: c.write && !proposed
                ? "Create a desktop layout to use a finer grid that fills a computer screen. The mobile layout stays as it is."
                : "This canvas has only a mobile layout.",
            }),
          );
          if (c.write && !proposed) {
            const make = el("button", { type: "button", className: "on", textContent: "Create desktop layout" });
            make.onclick = () => arrange(c.id, c.doc, false);
            blank.append(make);
          }
          return;
        }
        const plan = C.layout(face, page, me.slots || {});
        board.style.setProperty("--cols", plan.columns);
        roomFor(plan);
        for (const p of plan.pieces) {
          const made = MAKE[p.type](p);
          if (made) board.append(placed(made, p));
        }
        clocks.forEach((tick) => tick());

        // What is up with the devices this page is about, said once, above it.
        const used = new Set();
        for (const p of plan.pieces) {
          const plugin = p.key && !p.missing.length && C.deviceFor(plugins, p.key, p.device);
          if (plugin) used.add(plugin);
        }
        for (const plugin of used) {
          const trouble = plugin.status !== "running"
            ? "Stopped"
            : plugin.health.status !== "ok"
            ? (plugin.health.reason || plugin.health.status)
            : "";
          if (trouble) notes.append(el("span", { className: "bad", textContent: `${plugin.name}: ${trouble}` }));
          else if (plugin.mode !== "act") {
            notes.append(el("span", { textContent: `${plugin.name}: Read-only` }));
          }
        }
        if (plan.cut) {
          notes.append(
            el("span", {
              textContent: "Some elements on this page are hidden: the page exceeds the size limit.",
            }),
          );
        }
      }

      // --- Adding and removing canvases ---

      function unused(id) {
        let name = id, n = 1;
        while (canvases.some((c) => c.id === name)) name = id + "-" + ++n;
        return name;
      }
      function keep(id, doc) {
        asked.set(++ref, {
          doc: (m) => {
            if (!m.ok) return say(m.message, true);
            // The hub tells everyone on the screen about the new canvas next. It is opened when that arrives.
            wanted = id;
            shelf = false;
            draw();
          },
        });
        toHub({ type: "doc-put", id, doc, ref });
      }

      const slug = (name) =>
        String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50) || "canvas";

      /** Start arranging a canvas. A new one is not kept anywhere until Done. */
      function arrange(id, doc, fresh) {
        shelf = false;
        arr = globalThis.SkillfullyCanvasArrange.start({
          id,
          doc,
          fresh,
          which: fresh ? "mobile" : whichFor(current()),
          page: fresh ? 0 : page,
          el,
          say,
          board: $("board"),
          bar: $("bar"),
          panel: $("panel"),
          picker: $("picker"),
          plugins: () => plugins,
          values: (plugin) => values.get(plugin) || new Map(),
          defs: () => defs,
          slots: () => me.slots || {},
          draw,
          remove: (done) => {
            asked.set(++ref, {
              doc: (m) => {
                if (m.ok) say(`Deleted ${doc.name || id}.`);
                done(m);
              },
            });
            toHub({ type: "doc-remove", id, ref });
          },
          save: (_, made, done) => {
            // A new canvas takes its file name from the name it was given.
            const as = fresh ? unused(slug(made.name)) : id;
            asked.set(++ref, {
              doc: (m) => {
                if (m.ok) wanted = as;
                done(m);
              },
            });
            toHub({ type: "doc-put", id: as, doc: made, ref });
          },
          done: () => {
            page = arr.page;
            wantWhich = arr.which === (roomy() ? "desktop" : "mobile") ? null : arr.which;
            arr.stop();
            arr = null;
            draw();
          },
        });
        draw();
      }
      $("arrange").onclick = () => {
        const c = current();
        if (c && c.write && !c.problems.length) arrange(c.id, c.doc, false);
      };

      function drawShelf() {
        const box = $("shelf");
        box.innerHTML = "";
        const open = !arr && (shelf || (greeted && answered && !canvases.length && mayCreate));
        box.hidden = !open;
        if (!open) return;
        if (!canvases.length) $("blank").hidden = true;

        const starts = [];
        for (const s of STARTERS) {
          if (!plugins.some((p) => p.capabilities && s.needs in p.capabilities)) continue;
          starts.push({ name: s.doc.name, about: s.about, id: s.id, doc: s.doc });
        }
        for (const plugin of plugins) {
          const doc = C.fromReady(plugin, Object.fromEntries(values.get(plugin.id) || []));
          if (!doc) continue;
          const count = doc.pages.reduce((n, pg) => n + pg.pieces.length, 0);
          starts.push({
            name: plugin.name,
            about: `Its ${count} ready-made ${
              count === 1 ? "button" : "buttons"
            }, a page for each group they come in.`,
            id: plugin.id.slice(0, 50),
            doc,
          });
        }
        if (mayCreate) {
          const head = el(
            "div",
            { className: "shelfHead" },
            el("h2", {
              textContent: canvases.length ? "New canvas" : "Create a canvas",
            }),
          );
          if (canvases.length) {
            const back = el("button", {
              type: "button",
              className: "quiet",
              id: "shelfCancel",
              textContent: "Cancel",
            });
            back.onclick = () => {
              shelf = false;
              draw();
            };
            head.append(back);
          }
          box.append(head);
          if (!starts.length) {
            box.append(el("p", {
              textContent:
                "No devices connected to this screen. Templates appear here once an admin connects a device.",
            }));
          }
          const empty = el("button", {
            type: "button",
            className: "on",
            id: "startEmpty",
            textContent: "Create",
          });
          empty.onclick = () => arrange(null, C.edit.blank("New canvas"), true);
          box.append(
            el(
              "div",
              { className: "item" },
              el(
                "div",
                {},
                el("b", { textContent: "Blank canvas" }),
                el("span", { textContent: "One empty page." }),
              ),
              empty,
            ),
          );
          for (const s of starts) {
            const add = el("button", { type: "button", className: "on", textContent: "Add" });
            add.onclick = () => keep(unused(s.id), s.doc);
            box.append(
              el(
                "div",
                { className: "item" },
                el("div", {}, el("b", { textContent: s.name }), el("span", { textContent: s.about })),
                add,
              ),
            );
          }
        }
        box.append(el("p", {
          style: "margin:14px 0 0",
          textContent:
