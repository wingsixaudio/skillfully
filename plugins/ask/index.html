<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Skillfully: ask</title>
    <link rel="icon" href="data:,">
    <style>
    :root {
      --chassis: #000;
      --panel: #121214;
      --rail: #26262b;
      --text: #f4f4f5;
      --dim: #a1a1aa;
      --accent: #f7941d;
      --ok: #4ade80;
      --bad: #f87171;
      --font: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--chassis);
      color: var(--text);
      font-family: var(--font);
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    }
    header,
    #talk,
    #form {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 2px 10px;
      flex: none;
    }
    h1 {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--dim);
      margin-top: 2px;
    }
    .led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--bad);
      flex: none;
    }
    .led.on {
      background: var(--ok);
    }
    button {
      font: inherit;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      min-height: 44px;
      padding: 10px 16px;
      font-weight: 600;
      background: var(--accent);
      color: #000;
    }
    button.quiet {
      background: var(--rail);
      color: var(--text);
      font-weight: 500;
      font-size: 14px;
      min-height: 36px;
      padding: 6px 12px;
    }
    button:disabled {
      opacity: .45;
      cursor: default;
    }
    button:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #talk {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px 2px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .start {
      margin: auto 0;
      padding: 24px 0;
    }
    .start p {
      margin: 0 0 14px;
      color: var(--dim);
      line-height: 1.5;
      max-width: 34em;
    }
    .start div {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .mine,
    .theirs {
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-width: 100%;
    }
    .mine {
      align-self: flex-end;
      background: var(--rail);
      border-radius: 16px 16px 4px 16px;
      padding: 10px 14px;
      max-width: 85%;
    }
    .looked {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
      color: var(--dim);
      display: grid;
      gap: 4px;
    }
    .looked li {
      padding-left: 14px;
      position: relative;
    }
    .looked li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: .55em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--rail);
    }
    .waiting {
      font-size: 13px;
      color: var(--dim);
    }
    .waiting.done::after {
      content: none;
    }
    .yesno {
      background: var(--panel);
      border-radius: 16px;
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .yesno p {
      margin: 0;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .yesno div {
      display: flex;
      gap: 8px;
    }
    .yesno button {
      flex: 1;
    }
    .yesno button.no {
      background: var(--rail);
      color: var(--text);
      font-weight: 500;
    }
    .trouble {
      color: var(--bad);
      font-size: 14px;
      line-height: 1.45;
    }

    #form {
      flex: none;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      padding: 10px 0 max(14px, env(safe-area-inset-bottom));
    }
    textarea {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--rail);
      border-radius: 14px;
      padding: 11px 14px;
      resize: none;
      height: 46px;
      max-height: 160px;
      line-height: 1.4;
    }
    textarea::placeholder {
      color: var(--dim);
    }
    @media (prefers-reduced-motion: no-preference) {
      .waiting::after {
        content: "";
        display: inline-block;
        width: 1.2em;
        text-align: left;
        animation: dots 1.2s steps(4, end) infinite;
      }
      @keyframes dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
      }
    }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1 id="name">Ask</h1>
        <div class="link"
          aria-live="polite"><i class="led" id="led"></i><span id="linkText">Connecting</span></div>
      </div>
      <button class="quiet" id="fresh" type="button" hidden>Start over</button>
    </header>

    <div id="talk" role="log" aria-live="polite" aria-label="Conversation"></div>

    <div id="form">
      <textarea id="q" rows="1" maxlength="2000" placeholder="Ask about your equipment"
        aria-label="Your question"
        disabled></textarea>
      <button id="send" type="button" disabled>Ask</button>
    </div>

    <script>
    // This page runs in the hub's sandbox. It has no network and no access to the hub's own pages.
    // It talks to the hub's agent through the page around it, in AG-UI: it sends a run's input, and is
    // told what happens as events. Whether it may ask at all is fixed by "uses" in its plugin.json and
    // by the roles of whoever is signed in.
    (() => {
      const $ = (id) => document.getElementById(id);
      const toHub = (m) => parent.postMessage(m, "*");
      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      };
      const talk = $("talk"), q = $("q"), send = $("send");
      const EXAMPLES = ["Is everything working?", "What can you see?"];

      let linked = false, agent = null, threadId = null, running = false, any = false;
      // The card asking for a yes or a no, while one is open.
      let asking = null;
      // What is being built for the run under way: the lines for what it looks at, and the words it writes.
      let looked = null, saying = new Map(), waiting = null;

      const atEnd = () => talk.scrollHeight - talk.scrollTop - talk.clientHeight < 80;
      const add = (node) => {
        const stick = atEnd();
        talk.querySelector(".start")?.remove();
        talk.append(node);
        if (stick) talk.scrollTop = talk.scrollHeight;
        return node;
      };
      const settle = () => {
        const stick = atEnd();
        waiting?.remove();
        waiting = null;
        if (running) {
          waiting = el("div", "waiting", looked ? "Looking" : "Thinking");
          talk.append(waiting);
        }
        if (stick) talk.scrollTop = talk.scrollHeight;
      };

      function drawState() {
        const can = linked && agent && agent.ready;
        $("name").textContent = agent ? "Ask " + agent.name : "Ask";
        $("led").className = "led" + (can ? " on" : "");
        $("linkText").textContent = !linked
          ? "Connecting"
          : !agent
          ? "This hub has no agent yet"
          : agent.ready
          ? "Answers from what you can see"
          : agent.why + " Whoever runs this hub can change that.";
        q.disabled = !can || !!asking;
        q.placeholder = asking ? "Say yes or no first" : "Ask about your equipment";
        send.disabled = !can || !!asking;
        send.textContent = running ? "Stop" : "Ask";
        $("fresh").hidden = !any || running || !!asking;
      }

      function drawStart() {
        if (any || talk.querySelector(".start")) return;
        const box = el("div", "start");
        box.append(
          el(
            "p",
            "",
            "Ask in your own words. It looks at the equipment this hub is connected to and tells you what it finds. It can see what you can see on your other screens, and no more.",
          ),
        );
        const row = el("div");
        for (const text of EXAMPLES) {
          const b = el("button", "quiet", text);
          b.type = "button";
          b.onclick = () => ask(text);
          row.append(b);
        }
        box.append(row);
        talk.append(box);
      }

      function ask(text) {
        const content = text.trim();
        if (!content || running || !linked || !agent?.ready) return;
        toHub({
          type: "agent",
          do: "run",
          input: {
            threadId,
            runId: "r" + Date.now().toString(36),
            messages: [{ id: "m" + Date.now(), role: "user", content }],
          },
        });
      }

      // It has stopped to ask. What it asks is in the hub's words, and the hub does only what is shown here.
      function yesNo(interrupts) {
        asking?.remove();
        const card = el("div", "yesno");
        for (const i of interrupts) card.append(el("p", "", i.message));
        const row = el("div");
        const answer = (approved) => {
          asking = null;
          card.replaceWith(el("div", "waiting done", approved ? "You said yes." : "You said no."));
          toHub({
            type: "agent",
            do: "run",
            input: {
              threadId,
              runId: "r" + Date.now().toString(36),
              resume: interrupts.map((i) => ({ interruptId: i.id, status: "resolved", payload: { approved } })),
            },
          });
          drawState();
        };
        const yes = el("button", "", interrupts.length > 1 ? "Yes, all of it" : "Yes, do it");
        const no = el("button", "no", "No");
        yes.type = no.type = "button";
        yes.onclick = () => answer(true);
        no.onclick = () => answer(false);
        row.append(yes, no);
        card.append(row);
        asking = add(card);
        talk.scrollTop = talk.scrollHeight;
      }

      // One AG-UI event from the hub.
      function heard(e) {
        switch (e.type) {
          case "MESSAGES_SNAPSHOT":
            threadId = e.threadId;
            talk.textContent = "";
            any = e.messages.length > 0;
            for (const m of e.messages) talk.append(el("div", m.role === "user" ? "mine" : "theirs", m.content));
            running = false;
            looked = null;
            asking = null;
            saying.clear();
            drawStart();
            talk.scrollTop = talk.scrollHeight;
            break;
          case "RUN_STARTED":
            threadId = e.threadId;
            running = true;
            looked = null;
            break;
          case "CUSTOM":
            // The question as the hub took it, shown on every phone this conversation is open on.
            if (e.name === "skillfully.asked") {
              any = true;
              add(el("div", "mine", e.value.content));
              talk.scrollTop = talk.scrollHeight;
              if (q.value.trim() === e.value.content) {
                q.value = "";
                grow();
              }
            }
            break;
          case "TEXT_MESSAGE_START":
            waiting?.remove();
            saying.set(e.messageId, add(el("div", "theirs", "")));
            looked = null;
            break;
          case "TEXT_MESSAGE_CONTENT": {
            const node = saying.get(e.messageId);
            if (!node) break;
            const stick = atEnd();
            // Words, never a page: this is a model writing about other people's data.
            node.append(document.createTextNode(e.delta));
            if (stick) talk.scrollTop = talk.scrollHeight;
            break;
          }
          case "TEXT_MESSAGE_END":
            saying.delete(e.messageId);
            break;
          case "TOOL_CALL_RESULT":
            waiting?.remove();
            if (!looked) looked = add(el("ul", "looked"));
            looked.append(el("li", "", e.content));
            break;
          case "RUN_FINISHED":
            running = false;
            if (e.outcome?.type === "interrupt") yesNo(e.outcome.interrupts);
            break;
          case "RUN_ERROR":
            running = false;
            // Whatever it was asking, it is not asking any more.
            if (asking && e.code !== "not_answered" && e.code !== "busy") {
              asking.remove();
              asking = null;
            }
            add(el("div", "trouble", e.message || "It could not answer."));
            break;
        }
        settle();
        drawState();
      }

      const grow = () => {
        q.style.height = "46px";
        q.style.height = Math.min(q.scrollHeight + 2, 160) + "px";
      };
      q.oninput = grow;
      q.onkeydown = (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          if (!running) ask(q.value);
        }
      };
      // A button and not a form: a screen runs in a sandbox where forms are not sent anywhere.
      send.onclick = () => (running ? toHub({ type: "agent", do: "stop" }) : ask(q.value));
      $("fresh").onclick = () => toHub({ type: "agent", do: "new" });

      addEventListener("message", (e) => {
        const m = e.data;
        if (e.source !== parent || !m || typeof m !== "object") return;
        if (m.type === "link") {
          linked = m.up;
          if (!linked) running = false;
        } else if (m.type === "hello") {
          agent = m.agent ?? null;
          toHub({ type: "agent", do: "open" });
        } else if (m.type === "agent" && m.event) return heard(m.event);
        settle();
        drawState();
      });
      drawStart();
      drawState();
      toHub({ type: "ready" });
    })();
    </script>
  </body>
</html>
