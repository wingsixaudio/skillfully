<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Skillfully: one fader</title>
    <link rel="icon" href="data:,">
    <style>
    :root {
      --chassis: #000;
      --panel: #121214;
      --rail: #26262b;
      --text: #f4f4f5;
      --dim: #a1a1aa;
      --accent: #f7941d;
      --ok: #4ade80;
      --bad: #f87171;
      --font: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      background: var(--chassis);
      color: var(--text);
      font-family: var(--font);
    }
    body {
      min-height: 100dvh;
      padding: 16px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
    }
    main {
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 2px 8px;
    }
    header svg {
      width: 30px;
      height: 30px;
      flex: none;
    }
    header svg .core {
      stroke: var(--text);
    }
    header svg .mod {
      fill: var(--accent);
    }
    header b {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    header b span {
      color: var(--accent);
    }
    header .link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--dim);
    }
    .led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--bad);
    }
    .led.on {
      background: var(--ok);
    }

    .card {
      background: var(--panel);
      border-radius: 16px;
      padding: 18px;
    }
    .who {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .who h1 {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
    }
    .who p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--dim);
    }
    .db {
      font-size: 30px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
      white-space: nowrap;
    }
    .db small {
      font-size: 14px;
      font-weight: 500;
      color: var(--dim);
      margin-left: 3px;
    }

    .fader {
      position: relative;
      height: 56px;
      margin-top: 18px;
      border-radius: 14px;
      background: var(--rail);
      touch-action: pan-y;
      cursor: ew-resize;
      outline-offset: 4px;
      user-select: none;
      -webkit-user-select: none;
    }
    .fader:focus-visible {
      outline: 2px solid var(--accent);
    }
    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: 14px 0 0 14px;
      background: var(--accent);
      opacity: .28;
    }
    .thumb {
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 0;
      width: 22px;
      margin-left: -11px;
      border-radius: 11px;
      background: var(--accent);
    }
    .zero {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--chassis);
      opacity: .7;
    }
    .scale {
      position: relative;
      height: 16px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--dim);
    }
    .scale span {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .scale span:first-child {
      transform: none;
    }
    .scale span:last-child {
      transform: translateX(-100%);
    }

    .note {
      margin: 14px 0 0;
      font-size: 13px;
      color: var(--dim);
      min-height: 1.4em;
    }
    .note.bad {
      color: var(--bad);
    }
    .note:empty {
      margin: 0;
      min-height: 0;
    }

    h2 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 10px;
    }
    dl {
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 14px;
      font-size: 14px;
    }
    dt {
      color: var(--dim);
    }
    dd {
      margin: 0;
    }
    ol {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    li {
      font-size: 14px;
      line-height: 1.35;
    }
    li time {
      display: block;
      font-size: 12px;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
    }
    .empty {
      color: var(--dim);
      font-size: 14px;
    }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="link"
          aria-live="polite"><i class="led" id="led"></i><span id="linkText">Connecting</span></div>
      </header>

      <section class="card" aria-labelledby="t">
        <div class="who">
          <div>
            <h1 id="t">Input 1 in bus 1</h1>
            <p id="inputName">Waiting for the mixer</p>
          </div>
          <div class="db" id="db" aria-hidden="true">&nbsp;</div>
        </div>
        <div class="fader" id="fader" role="slider" tabindex="0" aria-labelledby="t" aria-valuemin="-90"
          aria-valuemax="10" aria-valuenow="-90">
          <div class="fill" id="fill"></div>
          <div class="zero" id="zero"></div>
          <div class="thumb" id="thumb"></div>
        </div>
        <div class="scale" id="scale" aria-hidden="true"></div>
        <p class="note" id="note" aria-live="polite"></p>
      </section>

      <section class="card" aria-labelledby="b">
        <h2 id="b">Mixer</h2>
        <dl id="plugin">
          <dt>Status</dt>
          <dd>Unknown</dd>
        </dl>
      </section>

      <section class="card" aria-labelledby="l">
        <h2 id="l">Activity</h2>
        <ol id="log">
          <li class="empty">No activity yet. Move the fader.</li>
        </ol>
      </section>
    </main>

    <script>
    // This page runs in the hub's sandbox. It has no network and no access to the
    // hub's own pages. Everything it knows arrives as a message from the page
    // around it, and everything it wants goes out the same way. What it may ask
    // for is fixed by "uses" in its plugin.json.
    (() => {
      // Which bus is this person's ears comes from the hub, set by whoever runs the team.
      const NAME = "console/input/1/name";
      let KEY = null, me = null, bus = "";
      const MIN = -90, KNEE = -60, MAX = 10, KNEE_AT = 0.1; // the first tenth of travel covers off to -60 dB
      const $ = (id) => document.getElementById(id);
      const fader = $("fader"), thumb = $("thumb"), fill = $("fill"), note = $("note");
      const toHub = (m) => parent.postMessage(m, "*");

      let linked = false, board = null, value = MIN, held = MIN;
      let dragging = false, quietUntil = 0, lastSent = 0, queued = null, waiting = null, ref = 0, answered = 0;

      const toPos = (db) =>
        db <= KNEE ? (db - MIN) / (KNEE - MIN) * KNEE_AT : KNEE_AT + (db - KNEE) / (MAX - KNEE) * (1 - KNEE_AT);
      const toDb = (pos) => {
        const p = Math.min(1, Math.max(0, pos));
        const db = p <= KNEE_AT
          ? MIN + p / KNEE_AT * (KNEE - MIN)
          : KNEE + (p - KNEE_AT) / (1 - KNEE_AT) * (MAX - KNEE);
        return Math.round(db * 2) / 2;
      };
      const words = (db) => db <= MIN ? "Off" : (db > 0 ? "+" : "") + db.toFixed(1);

      $("zero").style.left = toPos(0) * 100 + "%";
      // Scale marks sit where those levels really are on the fader.
      for (const [db, label] of [[MIN, "Off"], [-40, "-40"], [-20, "-20"], [0, "0"], [MAX, "+10"]]) {
        const mark = document.createElement("span");
        mark.textContent = label;
        mark.style.left = toPos(db) * 100 + "%";
        $("scale").append(mark);
      }

      function paint() {
        const pct = toPos(value) * 100 + "%";
        thumb.style.left = pct;
        fill.style.width = pct;
        $("db").innerHTML = value <= MIN ? "Off" : words(value) + "<small>dB</small>";
        fader.setAttribute("aria-valuenow", value);
        fader.setAttribute("aria-valuetext", value <= MIN ? "Off" : words(value) + " decibels");
      }

      function say(text, bad) {
        note.textContent = text;
        note.classList.toggle("bad", !!bad);
      }

      // At most one message every 33 ms. The hub also keeps only the newest value, so nothing queues up.
      function send(db) {
        value = db;
        paint();
        quietUntil = performance.now() + 400;
        const now = performance.now();
        if (now - lastSent < 33) {
          queued = db;
          if (!waiting) {
            waiting = setTimeout(() => {
              waiting = null;
              const v = queued;
              queued = null;
              if (v !== null) push(v);
            }, 33 - (now - lastSent));
          }
          return;
        }
        // Anything still waiting to go is older than this. It must never be sent after it.
        queued = null;
        push(db);
      }
      function push(db) {
        lastSent = performance.now();
        if (linked && board && KEY) toHub({ type: "set", plugin: board, key: KEY, value: db, ref: ++ref });
        else {say(
            !KEY
              ? "No monitor mix assigned to you."
              : board
              ? "Not sent: disconnected from the hub."
              : "No mixer connected.",
            true,
          );}
      }

      const fromPointer = (e) => {
        const r = fader.getBoundingClientRect();
        return toDb((e.clientX - r.left) / r.width);
      };
      fader.addEventListener("pointerdown", (e) => {
        dragging = true;
        fader.setPointerCapture(e.pointerId);
        send(fromPointer(e));
      });
      fader.addEventListener("pointermove", (e) => {
        if (dragging) send(fromPointer(e));
      });
      const release = () => {
        dragging = false;
        // While the thumb was down the board's answers were not shown. If it has already answered the last
        // thing sent, show what it holds now. Otherwise the answer still to come will.
        if (queued === null && answered === ref) {
          value = held;
          paint();
        }
      };
      fader.addEventListener("pointerup", release);
      fader.addEventListener("pointercancel", release);
      fader.addEventListener("keydown", (e) => {
        const step =
          { ArrowRight: 0.5, ArrowUp: 0.5, ArrowLeft: -0.5, ArrowDown: -0.5, PageUp: 5, PageDown: -5 }[e.key];
        if (e.key === "Home") send(MIN);
        else if (e.key === "End") send(MAX);
        else if (step) send(Math.min(MAX, Math.max(MIN, value + step)));
        else return;
        e.preventDefault();
      });

      function showPlugins(list) {
        const p = list.find((x) => x.capabilities && x.capabilities.console);
        board = p ? p.id : null;
        const rows = p
          ? [["Name", p.name], [
            "Status",
            {
              running: "Running",
              starting: "Starting",
              quarantined: "Stopped by the hub",
            }[p.status] || "Stopped",
          ], [
            "Mode",
            p.mode === "act" ? "Control enabled" : "Read-only",
          ]]
          : [["Status", "No mixer connected"]];
        $("plugin").innerHTML = "";
        for (const [k, v] of rows) {
          const dt = document.createElement("dt"), dd = document.createElement("dd");
          dt.textContent = k;
          dd.textContent = v; // plugin text is shown as text, never run
          $("plugin").append(dt, dd);
        }
      }

      const line = (e) => {
        const d = e.data, who = e.actor ? (me && e.actor === me.id ? "You" : "Someone else") : "";
        switch (e.type) {
          case "skillfully.command.confirmed":
            return `${who} set the level to ${words(d.value)} dB. It was ${words(d.before)}.` +
              (d.adjusted ? ` Requested ${d.requested}, mixer set ${d.value}.` : "") +
              ` Confirmed in ${d.ms} ms.`;
          case "skillfully.command.moved":
            return `${who} moved the level from ${words(d.from)} to ${
              words(d.value)
            } dB, in ${d.steps} steps over ${(d.ms / 1000).toFixed(1)} s.` +
              (d.adjusted ? ` Requested ${d.requested}, mixer set ${d.value}.` : "");
          case "skillfully.state.moved":
            return `Changed on the mixer: ${words(d.from)} to ${words(d.value)} dB.`;
          case "skillfully.command.failed":
            return `${who} requested ${d.requested} dB. Failed: ${d.message}.`;
          case "skillfully.command.blocked":
            return `${who} requested ${d.requested} dB. Not sent: the mixer is read-only.`;
          case "skillfully.command.rejected":
            return `${who} requested ${d.requested}. Rejected: ${d.message}.`;
          case "skillfully.state.changed": {
            const c = d.changes && KEY && d.changes[KEY];
            return c ? `Changed on the mixer: ${words(c.before)} to ${words(c.value)} dB.` : null;
          }
          case "skillfully.plugin.crashed":
            return "Mixer connection crashed. Restarting.";
          case "skillfully.plugin.limit":
            return `Mixer connection exceeded its ${d.limit} limit (${d.used} of ${d.allowed}). Stopped.`;
          case "skillfully.plugin.quarantined":
            return "Mixer connection exceeded its limits 3 times. Stopped until an admin restarts it.";
          case "skillfully.plugin.ready":
            return `Mixer connection ready: ${d.values} values.`;
          case "skillfully.plugin.mode":
            return d.mode === "act" ? "Control enabled for the mixer." : "Mixer set to read-only.";
          default:
            return null;
        }
      };
      function showLog(entries) {
        const items = [];
        for (const e of entries.slice().reverse()) {
          const about = e.subject || "";
          if (board && about !== board && !about.startsWith(board + ":")) continue;
          if (about.includes(":") && !(KEY && about.endsWith(KEY))) continue;
          const text = line(e);
          if (text) items.push([e.time, text]);
          if (items.length === 6) break;
        }
        const ol = $("log");
        ol.innerHTML = items.length ? "" : '<li class="empty">No activity yet. Move the fader.</li>';
        for (const [time, text] of items) {
          const li = document.createElement("li"), t = document.createElement("time");
          t.textContent = new Date(time).toLocaleTimeString();
          li.append(t, document.createTextNode(text));
          ol.append(li);
        }
      }
      // This screen shows two values: the name of input 1 and its send into this person's ears. It tells
      // the hub so, and is sent those two and nothing else.
      let told = "";
      const tellWatch = () => {
        if (!board) return;
        const keys = { [board]: [NAME, ...(KEY ? [KEY] : [])] };
        if (JSON.stringify(keys) === told) return;
        told = JSON.stringify(keys);
        toHub({ type: "watch", keys });
      };
      let logTimer, restTimer;
      const askLogSoon = () => {
        clearTimeout(logTimer);
        logTimer = setTimeout(() => toHub({ type: "log", limit: 60 }), 150);
        // A move is written to the log once the fader has been still for half a second. Ask again then.
        clearTimeout(restTimer);
        restTimer = setTimeout(() => toHub({ type: "log", limit: 60 }), 900);
      };

      addEventListener("message", (ev) => {
        if (ev.source !== parent) return;
        const m = ev.data;
        if (m.type === "link") {
          linked = m.up;
          $("led").classList.toggle("on", m.up);
          $("linkText").textContent = m.up ? "Connected" : "Reconnecting";
          if (m.up) say("");
        }
        if (m.type === "hello") {
          me = m.me;
          const ears = me && me.slots ? me.slots.ears : undefined;
          KEY = ears === undefined ? null : "console/input/1/bus/" + ears + "/level";
          $("t").textContent = KEY ? "Input 1 in your monitor mix" : "No monitor mix";
          bus = ears;
          if (!KEY) say("No monitor mix assigned to you. Ask your hub admin.", true);
        }
        if (m.type === "hello") told = "";
        if (m.type === "hello" || m.type === "plugins") {
          showPlugins(m.plugins);
          tellWatch();
          askLogSoon();
        }
        if (m.type === "state" && m.plugin === board) {
          if (typeof m.values[NAME] === "string") {
            $("inputName").textContent = m.values[NAME] + ", bus " + bus;
          }
          if (KEY && typeof m.values[KEY] === "number") {
            held = m.values[KEY];
            // While a thumb is on the fader, the thumb is in charge. Otherwise the board is.
            if (!dragging && performance.now() > quietUntil) {
              value = held;
              paint();
            }
          }
          if (!m.full) askLogSoon();
        }
        if (m.type === "ack") {
          if (typeof m.ref === "number" && m.ref > answered) answered = m.ref;
          if (m.ok && !m.superseded) held = m.value;
          if (m.ok && !m.superseded && m.ref === ref && !dragging) {
            value = m.value;
            paint();
            say("");
          }
          if (!m.ok) {
            say(m.error.message, true);
            quietUntil = 0;
            if (!dragging) {
              value = held;
              paint();
            }
          }
          askLogSoon();
        }
        if (m.type === "log") showLog(m.entries);
      });

      paint();
      toHub({ type: "ready" });
    })();
    </script>
  </body>
</html>
