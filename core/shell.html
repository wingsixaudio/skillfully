<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ NAME }} | Skillfully</title>
    <link rel="icon" href="data:,">
    <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    </style>
  </head>
  <body>
    <!-- The hub's own page. It shows one screen in a sandbox and carries messages
         between that screen and the hub. The screen cannot reach anything else. -->
    <iframe id="screen" title="{{NAME}}" sandbox="allow-scripts" src="/screens/{{ID}}/{{ENTRY}}"></iframe>
    <script>
    (() => {
      const frame = document.getElementById("screen");
      const toScreen = (m) => frame.contentWindow.postMessage(m, "*");
      let ws, ready = false;

      function connect() {
        ws = new WebSocket(
          (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?screen={{ID}}",
        );
        ws.onopen = () => {
          // No sign-in yet. When there is, this is where the person's ID comes from, never from the screen.
          ws.send(JSON.stringify({ type: "hello", actor: "person:guest" }));
          toScreen({ type: "link", up: true });
        };
        ws.onmessage = (e) => toScreen(JSON.parse(e.data));
        ws.onclose = () => {
          toScreen({ type: "link", up: false });
          setTimeout(connect, 1000);
        };
      }

      addEventListener("message", (e) => {
        if (e.source !== frame.contentWindow || !e.data || typeof e.data !== "object") return;
        if (e.data.type === "ready") {
          if (!ready) {
            ready = true;
            connect();
          }
          return;
        }
        // A screen may ask for two things. Whether it gets them is the hub's decision, from the screen's manifest.
        if ((e.data.type === "set" || e.data.type === "log") && ws && ws.readyState === 1) {
          ws.send(JSON.stringify(e.data));
        }
      });
    })();
    </script>
  </body>
</html>
