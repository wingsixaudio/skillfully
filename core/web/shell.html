<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ name }} | Skillfully</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/_hub/shell.css">
  </head>
  <body data-screen="{{id}}">
    <div
      id="bar"><svg viewBox="0 0 48 48" aria-hidden="true"><rect class="core" x="16" y="16" width="16" height="16" rx="4.5" fill="none" stroke-width="3.6"/><g class="mod"><rect x="19" y="3.5" width="10" height="7" rx="2.5"/><rect x="19" y="37.5" width="10" height="7" rx="2.5"/><rect x="3.5" y="19" width="7" height="10" rx="2.5"/><rect x="37.5" y="19" width="7" height="10" rx="2.5"/></g></svg><b>skillfully<span>.live</span></b><span id="besides"></span><button id="full" type="button" aria-label="Full screen" title="Full screen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button><details id="menu"><summary id="who">Menu</summary><div id="links"></div></details></div>
    <div id="stage">
      <iframe id="screen" title="{{name}}" sandbox="allow-scripts"
        data-src="/screens/{{id}}/{{entry}}"></iframe>
      <aside id="beside" hidden>
        <div id="besideBar"><button id="besideClose" type="button">Close</button></div>
        <iframe id="besideFrame" sandbox="allow-scripts"></iframe>
      </aside>
    </div>
    <div id="edge" hidden></div>
    <button id="unfull" type="button"
      hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>Exit full screen</button>
    <script src="/_hub/shell.js"></script>
  </body>
</html>
