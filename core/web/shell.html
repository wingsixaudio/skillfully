<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ name }} | Skillfully</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/_hub/shell.css">
  </head>
  <body data-screen="{{id}}">
    <div
      id="bar"><svg viewBox="0 0 48 48" aria-hidden="true"><rect class="core" x="16" y="16" width="16" height="16" rx="4.5" fill="none" stroke-width="3.6"/><g class="mod"><rect x="19" y="3.5" width="10" height="7" rx="2.5"/><rect x="19" y="37.5" width="10" height="7" rx="2.5"/><rect x="3.5" y="19" width="7" height="10" rx="2.5"/><rect x="37.5" y="19" width="7" height="10" rx="2.5"/></g></svg><b>skillfully<span>.live</span></b><span id="besides"></span><details id="menu"><summary id="who">Menu</summary><div id="links"></div></details></div>

        <div id="besideBar"><button id="besideClose" type="button">Close</button></div>
        <iframe id="besideFrame" sandbox="allow-scripts"></iframe>
      </aside>
