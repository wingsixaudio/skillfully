# Every pull request gets the same checks a maintainer would run by hand.
# Nothing here has access to secrets, and the token it runs with can only read.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Formatting
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Every plugin in the repository is one the hub would accept
        run: deno task check-plugin plugins/*
      - name: Tests
        run: deno task test
      - name: Every driver in the repository keeps the contract
        run: |
          for dir in plugins/*/; do
            if grep -q '"kind": "driver"' "$dir/plugin.json"; then deno task conformance "$dir"; fi
          done
